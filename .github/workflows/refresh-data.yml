name: Refresh live research data

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      pipeline:
        description: Pipeline to run
        required: true
        default: generated
        type: choice
        options:
          - generated
          - terminal
          - all

permissions:
  contents: write

concurrency:
  group: refresh-research-data
  cancel-in-progress: false

jobs:
  generated:
    if: github.event_name == 'workflow_dispatch' && (inputs.pipeline == 'generated' || inputs.pipeline == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run independent generated-data pipeline
        run: npm run build:generated

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated
          if git diff --cached --quiet; then
            echo "No generated data changes"
            exit 0
          fi
          git commit -m "Refresh generated research data"
          git push

  retention:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce generated-data retention
        run: npm run test:retention:generated && npm run retention:generated

      - name: Commit compacted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/raw/filings.json
          if git diff --cached --quiet; then
            echo "Generated data already satisfies retention policy"
            exit 0
          fi
          git commit -m "Prune generated research data"
          git push

  terminal:
    if: inputs.pipeline == 'terminal' || inputs.pipeline == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Postgres research pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: npm run pipeline:data
